name: Tests

# Grüne Suite als Merge-Voraussetzung (CLAUDE.md: "kein Merge ohne grüne Suite").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          # Repo-Minimum aus pyproject.toml (requires-python = ">=3.11").
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
            requirements.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          # Gepinnter Laufzeit-Snapshot zuerst — er bestimmt die Versionen.
          pip install -r requirements.lock
          # Test-Werkzeuge (zieht requirements.lock erneut mit, bleibt also versionsgleich).
          pip install -r requirements-dev.txt
          # Paket nur verlinken. --no-deps verhindert, dass das ungepinnte requirements.txt
          # (pyproject: dynamic dependencies) den Lockfile überstimmt; alle dort gelisteten
          # Pakete stecken bereits in requirements.lock.
          pip install -e . --no-deps

      - name: Tests
        # pyproject setzt testpaths=tests und ignoriert das Legacy-Demo tests/test_bot.py.
        # Läuft ohne Repository-Secrets: tests/conftest.py setzt die beim Import nötigen
        # Defaults (Dummy-ENCRYPTION_KEY). Tests, die echte Infrastruktur brauchen
        # (Postgres-Contract-Tests), überspringen sich wie bisher selbst — hier wird nichts
        # deselektiert.
        run: python -m pytest
