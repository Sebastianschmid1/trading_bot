<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Stock Signal Bot{% endblock %}</title>
<style>
  :root { --bg:#0f1420; --panel:#1a2030; --panel2:#222a3d; --fg:#e6e9ef; --muted:#8a93a6;
          --green:#2ecc71; --red:#e74c3c; --blue:#4f8cff; --line:#2a3346; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:.6rem 1rem;
           display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; position:sticky; top:0; }
  header .brand { font-weight:700; margin-right:.6rem; }
  nav a { color:var(--fg); text-decoration:none; padding:.35rem .6rem; border-radius:.5rem; font-size:.92rem; }
  nav a:hover, nav a.active { background:var(--panel2); }
  .badge { background:var(--red); color:#fff; border-radius:1rem; padding:0 .4rem; font-size:.72rem; margin-left:.2rem; }
  main { max-width:880px; margin:0 auto; padding:1rem; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:.8rem; padding:1rem; margin:.7rem 0; }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  .spacer { flex:1; }
  .muted { color:var(--muted); font-size:.86rem; }
  .pos { color:var(--green); } .neg { color:var(--red); }
  button, .btn { cursor:pointer; border:1px solid var(--line); background:var(--panel2); color:var(--fg);
                 border-radius:.5rem; padding:.45rem .7rem; font-size:.9rem; }
  button.green { background:var(--green); border-color:var(--green); color:#06231a; font-weight:600; }
  button.red { background:transparent; border-color:var(--red); color:var(--red); }
  button.on { background:var(--blue); border-color:var(--blue); color:#04122e; font-weight:600; }
  select, input[type=text], input[type=number], textarea { background:var(--panel2); color:var(--fg);
                 border:1px solid var(--line); border-radius:.5rem; padding:.4rem; }
  textarea { width:100%; min-height:7rem; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  form.inline { display:inline; }
  .flash { background:var(--panel2); border-left:3px solid var(--blue); padding:.6rem .8rem; border-radius:.4rem; margin:.6rem 0; }
  h1 { font-size:1.3rem; } h2 { font-size:1.05rem; border-bottom:1px solid var(--line); padding-bottom:.3rem; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  td, th { padding:.4rem .3rem; border-bottom:1px solid var(--line); text-align:left; }
  td.r, th.r { text-align:right; }
</style>
</head>
<body>
{% if user %}
<header>
  <span class="brand">📈 Signal Bot</span>
  <nav class="row">
    <a href="/app" class="{{ 'active' if active=='home' }}">Signale</a>
    <a href="/app/watchlist" class="{{ 'active' if active=='watchlist' }}">Watchlist</a>
    <a href="/app/settings" class="{{ 'active' if active=='settings' }}">Einstellungen</a>
    <a href="/app/notifications" class="{{ 'active' if active=='notifications' }}">Mitteilungen{% if unread %}<span class="badge">{{ unread }}</span>{% endif %}</a>
    <a href="/app/reports" class="{{ 'active' if active=='reports' }}">Reports</a>
    <a href="/app/algorithms" class="{{ 'active' if active=='algorithms' }}">Algorithmen</a>
    <a href="/app/backtest" class="{{ 'active' if active=='backtest' }}">Backtest</a>
    <a href="/app/dashboard">Dashboard</a>
  </nav>
  <span class="spacer"></span>
  <span class="muted">{{ user.username or user.user_id }}</span>
  <form class="inline" method="post" action="/logout"><button>Logout</button></form>
</header>
{% endif %}
<main>
  {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
