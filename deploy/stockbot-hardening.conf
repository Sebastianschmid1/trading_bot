# systemd-Drop-in: Prozess-Härtung für die AKTUELLE Installation unter /root/stockbot.
#
# Nach /etc/systemd/system/stockbot.service.d/hardening.conf kopieren, dann
# `systemctl daemon-reload && systemctl restart stockbot`.
#
# Warum separat von deploy/stockbot.service: jene Vorlage ist der Zielzustand nach Tor T1
# (eigener Nutzer `stockbot`, Repo unter /opt/stockbot) und setzt zusätzlich `ProtectHome=true`.
# Solange der Dienst als root AUS /root/stockbot läuft, würde ProtectHome das Arbeitsverzeichnis
# ausblenden und den Start verhindern. Dieses Drop-in nimmt deshalb alles mit, was OHNE die
# Migration wirkt — der Rest kommt mit T1.
#
# `User=root` bleibt hier bewusst unangetastet: der Wechsel auf einen unprivilegierten Nutzer
# ist der eigentliche Gewinn und gehört zusammen mit dem Pfadwechsel gemacht, nicht nebenbei.

[Service]
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
RestrictNamespaces=true
RestrictRealtime=true
LockPersonality=true

# ProtectSystem=strict macht das gesamte Dateisystem schreibgeschützt — hier stehen die
# Ausnahmen: Laufzeitdaten, Logs und die Bibliotheks-Caches (matplotlib, yfinance-Zeitzonen).
ReadWritePaths=/root/stockbot/data /root/stockbot/logs /root/.cache
