# systemd-Drop-in: Secrets als verschlüsselte Credentials statt in der .env
#
# Nach /etc/systemd/system/stockbot.service.d/credentials.conf kopieren, dann
# `systemctl daemon-reload && systemctl restart stockbot`.
#
# Voraussetzung: die referenzierten .cred-Dateien EXISTIEREN — eine fehlende Quelle ist für
# systemd fatal, der Dienst startet dann nicht. Anlegen (auf dem VPS, interaktives Terminal):
#
#   umask 077
#   read -rs KEY && printf '%s' "$KEY" \
#     | systemd-creds encrypt --name=ALPACA_API_KEY - /etc/stockbot/credentials/alpaca_api_key.cred
#   unset KEY
#
# Der bei `--name=` gesetzte Bezeichner MUSS mit dem Namen links vom Doppelpunkt unten
# übereinstimmen — und mit dem Namen, den `config._secret()` nachschlägt.
#
# Rotation: Datei neu verschlüsseln, `systemctl restart stockbot`. Die Werte liest der Prozess
# nur beim Start (config.py liest auf Modulebene).
#
# WICHTIG: Der hier hinterlegte Alpaca-Key ist der BETREIBER-Datenzugang für den globalen
# Signal-Scan (`analyzer._download_all_timeframes`), NICHT ein Trading-Key. Nutzer-Broker-
# Credentials gehören pro Nutzer verschlüsselt in die DB (`db.set_alpaca_credentials`).

[Service]
LoadCredentialEncrypted=ALPACA_API_KEY:/etc/stockbot/credentials/alpaca_api_key.cred
LoadCredentialEncrypted=ALPACA_API_SECRET:/etc/stockbot/credentials/alpaca_api_secret.cred
