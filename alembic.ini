## Alembic-Konfiguration (PLAT-001 — Vorbereitung PostgreSQL-Migration, siehe
## docs/PLAN_CHECKLIST.md Phase 1 / docs/Plan.md §9.1). `sqlalchemy.url` wird in
## migrations/env.py dynamisch aus stockbot.config.POSTGRES_DSN überschrieben — der
## Wert hier ist nur ein Offline-Fallback (z. B. `alembic history` ohne .env).

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql+psycopg2://stockbot:stockbot@localhost:5432/stockbot

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
